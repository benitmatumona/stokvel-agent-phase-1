<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stokvel by Voice</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Stokvel by Voice</h1>
      <p class="tag">Describe your savings group out loud. Nothing is deployed until you approve.</p>
    </header>

    <section aria-label="Progress">
      <ol id="stages" class="stages"></ol>
    </section>

    <section class="card" aria-label="Group preview">
      <h2>Your group</h2>
      <dl id="preview" class="preview">
        <div><dt>Name</dt><dd id="pv-name">-</dd></div>
        <div><dt>Members</dt><dd id="pv-members">-</dd></div>
        <div><dt>Each member pays</dt><dd id="pv-amount">-</dd></div>
        <div><dt>Payout</dt><dd id="pv-order">Fixed rotation</dd></div>
      </dl>
    </section>

    <section id="log" class="log" aria-live="polite" aria-label="Conversation"></section>

    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="mic" class="mic" aria-pressed="false" aria-label="Start listening">Mic</button>
      <input id="text" type="text" maxlength="2000" aria-label="Message"
             placeholder="Tap Mic and speak, or type here">
      <button type="submit" id="send">Send</button>
    </form>

    <div class="toggles">
      <label><input type="checkbox" id="voiceReplies" checked> Voice replies</label>
      <label><input type="checkbox" id="handsFree"> Hands-free</label>
      <button type="button" id="reset" class="link">New group</button>
    </div>
    <p id="note" class="note" role="status"></p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
